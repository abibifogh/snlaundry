<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Laundry Service</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script src="/assets/brand.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="gpage">
  <div class="wrap">
    <div class="brandbar" id="brand">
      <div class="mono-sm" id="brandMono" aria-hidden="true">sn</div>
      <div>
        <div class="name" id="brandName">Laundry Service</div>
        <div class="sub">In-house laundry</div>
      </div>
    </div>
    <div class="ghero"><h1>Laundry, washed and folded for you.</h1><p>Guests place an order here; staff manage everything from the reception app.</p></div>
    <div class="card" style="display:grid;gap:10px;margin-top:14px">
      <a class="btn big btn-full" href="/order">Place an order</a>
      <a class="btn big btn-full secondary" href="/app">Staff sign in</a>
    </div>
    <p class="center muted" style="font-size:12.5px">Guests normally reach the order page by scanning the QR code at reception.</p>
  </div>
  <script>
    fetch('/api/public-settings').then(r=>r.json()).then(s=>{
      if(window.applyBrandColors) applyBrandColors(s);
      if(s.hostelName){ document.getElementById('brandName').textContent = s.hostelName; document.title = s.hostelName + ' · Laundry'; }
      var m=document.getElementById('brandMono'); if(s.logoDataUrl){ const i=document.createElement('img'); i.src=s.logoDataUrl; i.alt=s.hostelName||''; m.replaceWith(i); } else if(s.hostelName){ var w=s.hostelName.trim().split(/\s+/); m.textContent=((w[0]||'L')[0]+(w[1]?w[1][0]:'')).toLowerCase(); }
    }).catch(()=>{});
  </script>
</body>
</html>
