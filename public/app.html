<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reception · Laundry</title>
  <script>/* apply the saved light/dark choice before first paint */try{var t=localStorage.getItem('laundry_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Laundry" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- ============ FIRST-RUN SETUP ============ -->
<div id="setupScreen" class="wrap hidden">
  <div class="brandbar"><div><div class="name">Welcome</div><div class="sub">First-time setup</div></div></div>
  <div class="card">
    <h2>Set up your laundry system</h2>
    <p class="hint">Create the first admin account. You can change everything later in Settings.</p>
    <div id="setupMsg"></div>
    <label>Hostel / property name</label>
    <input id="setupHostel" placeholder="e.g. Blue Wave Hostel" />
    <label>Your name (admin)</label>
    <input id="setupAdmin" placeholder="e.g. Alex" />
    <label>Choose an admin PIN (4–8 digits)</label>
    <input id="setupPin" inputmode="numeric" maxlength="8" placeholder="e.g. 4821" />
    <label>Confirm PIN</label>
    <input id="setupPin2" inputmode="numeric" maxlength="8" />
    <button class="btn-full" style="margin-top:16px" id="setupBtn">Create admin & continue</button>
  </div>
</div>

<!-- ============ LOCK / PIN SWITCH SCREEN ============ -->
<div id="lockScreen" class="hidden">
  <div class="lock-l">
    <span class="holes" aria-hidden="true"></span>
    <div class="brandbar" id="lockBrand">
      <div><div class="name" id="lockName">Laundry</div><div class="sub">Laundry · staff terminal</div></div>
    </div>
    <div class="clock" id="lockClock" aria-hidden="true"></div>
    <div class="date" id="lockDate"></div>
    <div class="shiftcard hidden" id="lockShift"></div>
  </div>
  <div class="lock-r">
    <div class="card pinbox">
      <h2>Enter your PIN</h2>
      <p class="hint">Your PIN signs you in as yourself.</p>
      <div class="pindots" id="pinDots" aria-live="polite"></div>
      <div id="pinMsg" role="alert"></div>
      <div class="pinpad" id="pinpad"></div>
    </div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Main">
      <div class="mono" id="railMono" aria-hidden="true"></div>
      <div class="tabs" id="tabs"></div>
      <button class="navbtn" id="moreBtn" type="button" aria-haspopup="menu"></button>
      <div class="rail-spacer"></div>
      <button class="navbtn" id="lockBtn" type="button"></button>
    </nav>
    <div class="main">
      <header class="apphead">
        <h1 id="viewTitle">Orders</h1>
        <div class="top-tools" id="topTools"></div>
        <button class="chip-shift hidden" id="shiftChip" type="button"></button>
        <button class="avatar" id="avatarBtn" type="button" aria-haspopup="menu" aria-label="Account menu"></button>
        <span class="hidden" id="topName"></span>
      </header>
      <main class="content" id="scroller"><div id="view"></div></main>
    </div>
  </div>
  <div class="backdrop hidden" id="menuBackdrop"></div>
  <div class="menu hidden" id="userMenu" role="menu">
    <div class="who"><b id="whoName"></b><small id="whoRole"></small></div>
    <div class="sep"></div>
    <div id="menuControls"></div>
    <div class="mi" style="padding-bottom:2px"><span>Appearance</span></div>
    <div class="seg3" id="themeSeg"></div>
    <div class="sep"></div>
    <button type="button" id="menuLock"></button>
  </div>
  <div class="menu hidden" id="shiftMenu" role="menu"></div>
  <div class="menu hidden" id="moreMenu" role="menu"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- generic modal host -->
<div id="modalHost"></div>

<script src="/assets/guide.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/linen.js"></script>
<script src="/assets/linen-simple.js"></script>
</body>
</html>
